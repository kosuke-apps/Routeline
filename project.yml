name: Routeline
options:
  bundleIdPrefix: dev.kosuke
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.7.6"
    CURRENT_PROJECT_VERSION: "22"
packages:
  Routeline:
    path: .
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0
targets:
  Routeline:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources/glyphs
      # Label glyphs keep their folder layout inside the bundle: glyphs/<font>/<range>.pbf.
      - path: App/Resources/glyphs
        type: folder
        buildPhase: resources
      # Offline basemap, fetched by tools/fetch_basemap.sh (not committed).
      - path: data/maps/madison.pmtiles
        buildPhase: resources
      # Punctuality statistics, built by tools/build_punctuality.sh from the recordings (not committed).
      - path: data/punctuality/punctuality.json
        buildPhase: resources
      # Timetable seed for the first launch, fetched by tools/fetch_timetable.sh (not committed).
      - path: data/seed/mmt_gtfs.zip
        buildPhase: resources
    dependencies:
      - package: Routeline
        product: RoutelineCore
      - package: MapLibre
        product: MapLibre
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Routeline
        NSHumanReadableCopyright: "Copyright © 2026 Kosuke Satake. MIT License."
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: Routeline shows where you are on the map and finds nearby stops.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.kosuke.headway.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kosuke.headway
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
  RoutelineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: Routeline
      - package: Routeline
        product: RoutelineCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kosuke.headway.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Routeline:
    build:
      targets:
        Routeline: all
    test:
      targets:
        - RoutelineTests
